name: OrionCodeIntel CI

on:
  push:
    paths:
      - 'OrionMacOs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'OrionMacOs/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: OrionMacOs
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # The Starlette integration tests XCTSkip when the (gitignored) vendored corpus
      # and/or npx are absent, so CI exercises the ~100 unit tests.
      - name: Test
        run: swift test
