# xcodegen spec for OrionApp.xcodeproj (Docs/13_phase4_architecture_ui.md M0).
#
# Source of truth for the Xcode project -- regenerate after any change here with:
#   cd OrionApp && xcodegen generate
#
# The generated .xcodeproj is committed too (Xcode-project convention: clone-and-open should
# not require xcodegen installed), but project.yml is what should actually be hand-edited.

name: OrionApp
options:
  createIntermediateGroups: true
  # Matches OrionMacOs/Package.swift's `.macOS("27.0")` floor (Docs/18 M0: FoundationModels OS 27
  # APIs + Core AI) -- OrionAgent can't be linked below this anyway.
  deploymentTarget:
    macOS: "27.0"
  bundleIdPrefix: com.gilangbbe.orion

packages:
  OrionMacOs:
    path: ../OrionMacOs
  # Verified against the real tagged 1.1.0 source (Docs/13 Decision 3, M0) -- swift-tools-version
  # 5.9, macOS 14+ floor, `Grape` product (depends on `ForceSimulation`), confirmed API:
  # ForceDirectedGraph/NodeMark/LinkMark/ForceDirectedGraphState.
  #
  # Vendored, not `url:`/`from: 1.1.0`, since macOS 27 / Xcode 27 (Swift 6.4): the tagged release
  # no longer compiles there (`@State` is now a real macro whose synthesized `private` backing
  # store can't be referenced from Grape's `@inlinable` `GraphDragModifier` -- "Property
  # '_dragState' is private and cannot be referenced from an '@inlinable' function"), no upstream
  # release contains the fix (open PR li3zhen1/Grape#78), and pinning a third-party fork's commit
  # would make every build depend on that fork surviving. ../Vendor/Grape is upstream `main` plus
  # exactly that one 17-line `@inlinable`-removal patch -- see Vendor/Grape/ORION_VENDORED.md for
  # full provenance and how to un-vendor once upstream tags a release with the fix.
  Grape:
    path: ../Vendor/Grape

targets:
  Orion:
    type: application
    platform: macOS
    sources:
      - path: Orion
      # Loaders, models and views shared with the iOS companion (Docs/19 M4); its own
      # OrionMobile/project.yml compiles the same folder.
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Orion
        PRODUCT_BUNDLE_IDENTIFIER: com.gilangbbe.orion.mac
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Orion
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Decision 4 (Docs/13): unsandboxed -- no entitlements file, no
        # com.apple.security.app-sandbox key. Phases 1-3 already shell out to git/npx/claude and
        # download multi-GB model weights; reproducing that under App Sandbox entitlements is
        # out of scope for this phase (Docs/13 Risk 1).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Team set 2026-09-30 (Docs/19 M0), shared with OrionMobile/project.yml. Since Docs/19 M5
        # the app signs with a real Apple Development identity: CloudKit entitlements need a
        # provisioning profile (automatic -- pass -allowProvisioningUpdates to xcodebuild). Still
        # unsandboxed (Decision 4 above); CloudKit doesn't require the sandbox.
        DEVELOPMENT_TEAM: S3AP74B5TH
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
    # Docs/19 M5: "Sync to iPhone" publishes knowledge snapshots to the user's private CloudKit
    # database; the iOS companion (OrionMobile) receives them from the same container.
    entitlements:
      path: Orion/Orion.entitlements
      properties:
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.gilangbbe.orion
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: OrionMacOs
        product: OrionCodeIntel
      - package: OrionMacOs
        product: OrionAgent
      - package: OrionMacOs
        product: OrionSync
      - package: Grape
        product: Grape

  OrionAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OrionAppTests
    dependencies:
      - target: Orion
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gilangbbe.orion.mac.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES

schemes:
  Orion:
    build:
      targets:
        Orion: all
        OrionAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrionAppTests
