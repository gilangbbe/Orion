# xcodegen spec for OrionApp.xcodeproj (Docs/13_phase4_architecture_ui.md M0).
#
# Source of truth for the Xcode project -- regenerate after any change here with:
#   cd OrionApp && xcodegen generate
#
# The generated .xcodeproj is committed too (Xcode-project convention: clone-and-open should
# not require xcodegen installed), but project.yml is what should actually be hand-edited.

name: OrionApp
options:
  createIntermediateGroups: true
  # Matches OrionMacOs/Package.swift's `.macOS(.v26)` floor (FoundationModels' real minimum,
  # Docs/12 M1) -- OrionAgent can't be linked below this anyway.
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: com.orion

packages:
  OrionMacOs:
    path: ../OrionMacOs
  # Verified against the real tagged 1.1.0 source (Docs/13 Decision 3, M0) -- swift-tools-version
  # 5.9, macOS 14+ floor, `Grape` product (depends on `ForceSimulation`), confirmed API:
  # ForceDirectedGraph/NodeMark/LinkMark/ForceDirectedGraphState.
  Grape:
    url: https://github.com/SwiftGraphs/Grape
    from: 1.1.0

targets:
  Orion:
    type: application
    platform: macOS
    sources:
      - path: Orion
    settings:
      base:
        PRODUCT_NAME: Orion
        PRODUCT_BUNDLE_IDENTIFIER: com.orion.OrionApp
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Orion
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Decision 4 (Docs/13): unsandboxed -- no entitlements file, no
        # com.apple.security.app-sandbox key. Phases 1-3 already shell out to git/npx/claude and
        # download multi-GB model weights; reproducing that under App Sandbox entitlements is
        # out of scope for this phase (Docs/13 Risk 1).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # No Apple Developer Team configured in this environment -- sign for local execution
        # only ("Sign to Run Locally" equivalent) so `xcodebuild build` succeeds without one.
        # Switch to a real team + Developer ID in Xcode's Signing & Capabilities tab whenever
        # distribution is actually needed (Docs/13 Decision 4).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - package: OrionMacOs
        product: OrionCodeIntel
      - package: OrionMacOs
        product: OrionAgent
      - package: Grape
        product: Grape

  OrionAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OrionAppTests
    dependencies:
      - target: Orion
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES

schemes:
  Orion:
    build:
      targets:
        Orion: all
        OrionAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrionAppTests
