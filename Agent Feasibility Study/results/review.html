<style>

  code{font-family:ui-monospace,Menlo,monospace}

  .human{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .human .axis{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:12px}
  .human .axis span{width:150px;color:var(--muted)}
  .human .axis button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:5px;width:26px;height:22px;cursor:pointer}

 the environment variable value is considered the \"winning\" value, and it is returned by the `get` method of Config.__call__.\",\n  \"key_points\": [\n    \"The environment variable value wins over the.env file value for the same key.\",\n    \"The environment variable value is checked first in the `get` method of Config.__call__.\",\n    \"If the environment variable value does not exist, then the value from the.env file is checked.\"\n  ],\n  \"evidence\": [\n    {\n      \"file\": \"starlette/config.py\",\n      \"symbol\": \"Config.get(key, cast, default)\",\n      \"why\": \"The environment variable value is checked first in the `get` method of Config.__call__.\"\n    }\n  ],\n  \"epistemic_status\": \"VERIFIED\",\n  \"uncertainties\": [\n    \"What happens if the environment variable value does not exist?\"\n  ]\n}", "json_method": "none", "schema_valid": false, "schema_errors": ["not a JSON object"], "context_files": ["starlette/config.py"], "context_truncated": false, "perf": {"ttft_seconds": 0.7623, "total_seconds": 5.9179, "gen_tps": 57.77, "gen_tokens": 297, "prompt_tokens": 1543, "peak_memory_gb": 3.738, "finish_reason": "stop"}, "grade": {"id": "CU-09", "category": "code_understanding", "difficulty": "medium", "structured_output": 0, "evidence_accuracy": 0, "evidence_file_recall": 0.0, "evidence_symbol_recall": 0.0, "fabricated_paths": [], "n_citations": 0, "completeness_proxy": 0, "concept_coverage": 0.0, "epistemic_alignment": 0, "epistemic_expected": "VERIFIED", "epistemic_got": null, "judge_ok": true, "judge_rationale": "Correctly states environment variable precedence, mentions error on missing, and aligns with reference.", "correctness": 2, "completeness": 2, "architectural_reasoning": 2, "hallucination": 2, "teaching_quality": null, "composite": 0.6667, "composite_axes_used": ["correctness", "completeness", "architectural_reasoning", "hallucination", "evidence_accuracy", "structured_output"]}}, "qwen3-8b-4bit": {"answer_obj": {"answer": "When C ess it has its own try/except.", "required_concepts": ["endpoint invoked via routing.py request_response/Route.handle", "ExceptionMiddleware only catches registered types -> re-raises ValueError", "ServerErrorMiddleware (outermost) catches it -> 500", "re-raise for logging", "user middleware is in between and passive by default"], "relevant_files": ["starlette/routing.py", "starlette/middleware/exceptions.py", "starlette/middleware/errors.py", "starlette/applications.py"], "relevant_symbols": ["starlette/routing.py::request_response", "starlette/middleware/exceptions.py::ExceptionMiddleware.__call__", "starlette/middleware/errors.py::ServerErrorMiddleware.__call__", "starlette/applications.py::Starlette.build_middleware_stack"], "evidence": [{"file": "starlette/middleware/exceptions.py", "symbol": "starlette/middleware/exceptions.py::ExceptionMiddleware.__call__", "line_hint": 35, "type": "SOURCE", "line": 47}, {"file": "starlette/middleware/errors.py", "symbol": "starlette/middleware/errors.py::ServerErrorMiddleware.__call__", "line_hint": 140, "type": "SOURCE", "line": 149}, {"file": "starlette/applications.py", "symbol": "starlette/applications.py::Starlette.build_middleware_stack", "line_hint": 49, "type": "SOURCE", "line": 63}, {"file": "tests/middleware/test_errors.py", "symbol": "tests/middleware/test_errors.py", "line_hint": null, "type": "TEST", "line": null}], "common_misconceptions": ["ExceptionMiddleware converts the ValueError to a 500", "The 500 is produced inside routing.py", "ServerErrorMiddleware swallows the exception"], "answerable_from": "source+tests", "expected_epistemic_status": "VERIFIED", "grading_notes": "Full credit needs the correct layer that produces the 500 (ServerErrorMiddleware, not ExceptionMiddleware) and the fact that ExceptionMiddleware passes non-registered exceptions through. Attributing the 500 to ExceptionMiddleware is the defining error for this item.", "points": 2, "answers": {"llama-3.2-3b-4bit": {"answer_obj": {"answer": ": "SOURCE", "line": 19}, {"file": "tests/test_background.py", "symbol": "tests/test_background.py", "line_hint": null, "type": "TEST", "line": null}], "common_misconceptions": ["Concurrent execution is strictly better and backward compatible", "Tasks are already effectively concurrent", "Error behaviour would be identical"], "answerable_from": "source+tests", "expected_epistemic_status": "VERIFIED", "grading_notes": "Must name ordering dependence AND the changed error/cancellation semantics.", "points": 2, "answers": {"llama-3.2-3b-4bit": {"answer_obj": null, "raw_text": "{\n  \"answer\": If BackgroundTasks were changed to run its tasks concurrently, existing applications that rely on the sequential execution of tasks could break. This is because concurrent execution might not guarantee the correct order of task execution, potentially leading to unexpected behavior or errors. For example, if a task depends on the result of another task, concurrent execution could cause the dependent task to be executed before the dependent task has finished, resulting in incorrect results. Additionally, concurrent execution might also introduce new dependencies or conflicts that were not present in the sequential execution model, potentially leading to errors or unexpected behavior. The change could break applications that rely on the sequential execution of tasks, such as those that use the `await` keyword to wait for tasks to complete, or those that rely on the specific order of task execution.\n  \"key_points\": [\n    \"Existing applications that rely on sequential task execution could break\",\n    \"Concurrent execution might not guarantee correct order of task execution\"\n  ],\n  \"evidence\": [\n    {\n      \"file\": \"starlette/background.py\",\n      \"symbol\": \"BackgroundTasks\",\n      \"why\": \"The class is used to manage a list of tasks to be executed sequentially\"\n    }\n  ],\n  \"epistemic_status\": \"VERIFIED\",\n  \"uncertainties\": [\n    \"The exact impact of concurrent execution on existing applications\"\n  ]\n}", "json_method": "none", "schema_valid": false, "schema_errors": ["not a JSON object"], "context_files": ["starlette/background.py"], "context_truncated": false, "perf": {"ttft_seconds": 0.4063, "total_seconds": 5.4557, "gen_tps": 55.42, "gen_tokens": 279, "prompt_tokens": 731, "peak_memory_gb": 5.028, "finish_reason": "stop"}, "grade": {"id": "DC-04", "category": "dependency_change_impact", "difficulty": "medium", "structured_output": 0, "evidence_accuracy": 0, "evidence_file_recall": 0.0, "evidence_symbol_recall": 0.0, "fabricated_paths": [], "n_citations": 0, "completeness_proxy": 0, "concept_coverage": 0.0, "epistemic_alignment": 0, "epistemic_expected": "VERIFIED", "epistemic_got": null, "judge_ok": true, "judge_rationale": "Mentions ordering issues but misses concurrency hazards, error semantics, resource spikes, and test assertions.", "correctness": 1, "completeness": 1, "architectural_reasoning": 1, "hallucination": 1, "teaching_quality": null, "composite": 0.3333, "composite_axes_used": ["correctness", "completeness", "architectural_reasoning", "hallucination", "evidence_accuracy", "structured_output"]}}, "qwen3-8b-4bit": {"answer_obj": {"answer": "If BackgroundTasks were changed to run its tasks concurrently instead of sequentially, existing applications that rely on the sequential execution of background tasks could break. This is because the order of execution and potential side effects of task execution may change, leading to unexpected behavior or errors.", "key_points": ["Existing applications may rely on the sequential execution of background tasks.", "Changing to concurrent execution could alter the order of operations and side effects."], "evidence": [{"file": "starlette/background.py", "symbol": "BackgroundTasks.__call__", "why": "The current implementation runs tasks sequentially, which is critical for applications that depend on task order."}], "epistemic_status": "VERIFIED", "uncertai ient`, the same behavior occurs: the `TestClient` will catch the exception, and if `raise_server_exceptions` is set to `True`, it will propagate the exception, potentially causing the test to fail or the response to be marked as an error. If `raise_server_exceptions` is `False`, the `TestClient` will return a 500 error response.\",\n  \"key_points\": [\n    \"The lifespan context manager's exception during startup affects both ASGI server and TestClient behavior.\",\n    \"The `TestClient` may raise the exception or return a 500 error depending on `raise_server_exceptions`.\"\n  ],\n  \"evidence\": [\n    {\n      \"file\": \"starlette/routing.py\",\n      \"symbol\": \"Router.lifespan\",\n      \"why\": \"The `lifespan` method handles startup and shutdown events, and exceptions during startup are propagated.\"\n    },\n    {\n      \"file\": \"starlette/testclient.py\",\n      \"symbol\": \"TestClient.request\",\n      \"why\": \"The `TestClient` handles exceptions raised during the ASGI app's execution, and `raise_server_exceptions` controls whether the exception is propagated.\"\n    }\n  ],\n  \"epistemic_status\": \"VERIFIED\",\n  \"uncertainties\": []\n}", "json_method": "clean", "schema_valid": true, "schema_errors": [], "context_files": ["starlette/routing.py", "starlette/testclient.py"], "context_truncated": false, "perf": {"ttft_seconds": 17.9072, "total_seconds": 36.5711, "gen_tps": 19.14, "gen_tokens": 357, "prompt_tokens": 13362, "peak_memory_gb": 8.733, "finish_reason": "stop"}, "grade": {"id": "BR-09", "category": "behavioral_reasoning", "difficulty": "hard", "structured_output": 2, "evidence_accuracy": 2, "evidence_file_recall": 1.0, "evidence_symbol_recall": 0.5, "fabricated_paths": [], "n_citations": 2, "completeness_proxy": 2, "concept_coverage": 0.75, "epistemic_alignment": 2, "epistemic_expected": "VERIFIED", "epistemic_got": "VERIFIED", "judge_ok": true, "judge_rationale": "Mentions 500 error as a misconception, but doesn't clarify it's incorre andler(HTTPException) will catch any HTTPException raised anywhere in the app, but it will not catch any HTTPException raised from custom middleware. Custom middleware is run before the app's exception handlers, so any HTTPException raised from custom middleware will be caught by the app's exception handlers, not by the custom middleware's exception handler.\",\n  \"key_points\": [\n    \"The developer's explanation is incorrect about custom middleware\",\n    \"The developer's explanation is incorrect about the order of exception handlers\"\n  ],\n  \"evidence\": [\n    {\n      \"file\": \"starlette/applications.py\",\n      \"symbol\": \"app.exception_handlers\",\n      \"why\": \"This shows that the app's exception handlers are registered with @app.exception_handler\"\n    },\n    {\n      \"file\": \"starlette/middleware/exceptions.py\",\n      \"symbol\": \"ExceptionMiddleware\",\n      \"why\": \"This shows that custom middleware can raise an HTTPException, which will be caught by the app's exception handlers\"\n    }\n  ],\n  \"epistemic_status\": \"VERIFIED\",\n  \"uncertainties\": [\n    \"The developer's explanation about custom middleware\"\n  ]\n}", "json_method": "clean", "schema_valid": true, "schema_errors": [], "context_files": ["starlette/applications.py", "starlette/middleware/exceptions.py", "starlette/middleware/errors.py"], "context_truncated": false, "perf": {"ttft_seconds": 2.1518, "total_seconds": 7.2983, "gen_tps": 49.88, "gen_tokens": 256, "prompt_tokens": 4247, "peak_memory_gb": 5.028, "finish_reason": "stop"}, "grade": {"id": "TE-01", "category": "teaching", "difficulty": "hard", "structured_output": 2, "evidence_accuracy": 2, "evidence_file_recall": 0.667, "evidence_symbol_recall": 0.333, "fabricated_paths": [], "n_citations": 2, "completeness_proxy": 0, "concept_coverage": 0.0, "epistemic_alignment": 0, "epistemic_expected": "CONTRADICTED", "epistemic_got": "VERIFIED", "judge_ok": true, "judge_rationale": "Candidate correctly identifies error but misrepresents middleware order and exception flow.", "correctness": 1, "completeness": 1, "architectural_reasoning": 1, "hallucination": 1, "teaching_quality": null, "composite": 0.6667, "composite_axes_used": ["correctness", "completeness", "architectural_reasoning", "hallucination", "evidence_accuracy", "structured_output"]}}, "qwen3-8b-4bit": {"answer_obj": {"answer": "The developer's explanation is correct. The @app.exception_handler decorator in Starlette is used to register exception handlers that will catch specific exception types, such as HTTPException, raised anywhere in the application. This includes exceptions raised from custom middleware, as the exception handling mechanism is global and applies to the entire application stack.", "key_points": ["The @app.exception_handler decorator registers handlers for specific exception types.", "These handlers are global and apply to the entire application, including custom middleware."], "evidence": [{"file": "starlette/middleware/exceptions.py", "symbol": "ExceptionMiddleware.add_exception_handler", "why": "The add_exception_handler method in ExceptionMiddleware allows registering handlers for specific exception types, which are then used globally."}, {"file": "starlette/applications.py", "symbol": "Starlette.add_exception_handler", "why": "The add_exception_handler method in Starlette allows developers to register exception handlers, which are then used by the middleware."}], "epistemic_status": "VERIFIED", "uncertainties": []}, "raw_text": "{\n  \"answer\": \"The developer's explanation is correct. The @app.exception_handler decorator in Starlette is used to register exception handlers that will catch specific exception types, such as HTTPException, raised anywhere in the application. This includes exceptions raised from custom middleware, as the exception handling mechanism is global and applies to the entire application stack.\",\n  \"key_points\": [\n    \"The @app.exception_handler decorator reg  "category": "teaching", "difficulty": "medium", "question": "Assess for correctness and correct any misconception: 'Background tasks are a good place to decide whether to send the user a different response -- e.g. if the task fails, return a 500 to the client instead.'", "developer_explanation": "Background tasks are a good place to decide whether to send the user a different response -- e.g. if the task fails, return a 500 to the client instead.", "expected_answer": "Incorrect. By the time background tasks run, the response (status line + headers + body) has already been sent to the client -- Response.__call__ awaits self.background only after emitting the body. A background task cannot alter, replace, or add to that response. If a task raises, the client still has the original (e.g. 200); the exception is logged server-side and, under TestClient, raised into the test. If the outcome must affect the client's response, do the work synchronously in the endpoint before returning, not in a background task. Background tasks are for fire-and-forget side effects (emails, cache warming, audit writes). Check for the developer: 'At what line of Response.__call__ is self.background awaited relative to the body send?'", "required_concepts": ["response already sent before tasks run", "tasks cannot change the response", "failure is logged, client keeps original response", "move outcome-affecting work into the endpoint", "background = fire-and-forget"], "relevant_files": ["starlette/responses.py", "starlette/background.py"], "relevant_symbols": ["starlette/responses.py::Response.__call__", "starlette/background.py::BackgroundTasks.__call__"], "evidence": [{"file": "starlette/responses.py", "symbol": "starlette/responses.py::Response.__call__", "line_hint": null, "type": "SOURCE", "line": 163}, {"file": "starlette/background.py", "symbol": "starlette/background.py::BackgroundTasks.__call__", "line_hint": 34, "type": "SOURCE", "line": 19}], "common_misconceptions": ["Agreeing that cluding the /v1 prefix. Check for the developer: 'After Mount strips its prefix, what value does the sub-app see for scope[\"path\"] vs scope[\"root_path\"]?'", "required_concepts": ["Mount strips its prefix before calling the sub-app", "sub-app routes are declared WITHOUT the prefix", "prefix goes into root_path", "double-prefixing would require /v1/v1/...", "root_path drives url_for"], "relevant_files": ["starlette/routing.py"], "relevant_symbols": ["starlette/routing.py::Mount.matches", "starlette/routing.py::Mount.handle"], "evidence": [{"file": "starlette/routing.py", "symbol": "starlette/routing.py::Mount.matches", "line_hint": 399, "type": "SOURCE", "line": 168}, {"file": "tests/test_routing.py", "symbol": "tests/test_routing.py", "line_hint": null, "type": "TEST", "line": null}], "common_misconceptions": ["Agreeing that sub-app routes need the prefix", "Claiming Mount does not touch the path at all", "Saying root_path is irrelevant to url_for"], "answerable_from": "source+tests", "expected_epistemic_status": "CONTRADICTED", "grading_notes": "Must state routes are declared without the prefix and that the prefix lives in root_path. Ties to XF-03/TR-04.", "points": 1, "answers": {"llama-3.2-3b-4bit": {"answer_obj": {"answer": "The developer's explanation is incorrect. When you Mount a sub-application at /v1, the routes inside that sub-application do not have to be declared with the /v1 prefix. The routes can be declared without the prefix, and the Mount will handle the routing correctly. For example, you can declare a route for /users without the prefix, like Route('/users',...).", "key_points": ["The developer's explanation is incorrect about the prefix for routes in a sub-application."], "evidence": [{"file": "starlette/routing.py", "symbol": "Mount", "why": "The Mount class does not require routes to have a prefix."}], "epistemic_status": "VERIFIED", "uncertainties": ["The developer's explanation may be unclear about the correct prefix for routes in a sub-application."]}, "raw_text": "{\n  \"answer\": \"The developer's explanation is incorrect. When you Mount a sub-application at /v1, the routes inside that sub-application do not have to be declared with the /v1 prefix. The routes can be declared without the prefix, and the Mount will handle the routing correctly. For example, you can declare a route for /users without the prefix, like Route('/users',...).\",\n  \"key_points\": [\n    \"The developer's explanation is incorrect about the prefix for routes in a sub-application.\"\n  ],\n  \"evidence\": [\n    {\n      \"file\": \"starlette/routing.py\",\n      \"symbol\": \"Mount\",\n      \"why\": \"The Mount class does not require routes to have a prefix.\"\n    }\n  ],\n  \"epistemic_status\": \"VERIFIED\",\n  \"uncertainties\": [\n    \"The developer's explanation may be unclear about the correct prefix for routes in a sub-application.\"\n  ]\n}", "json_method": "clean", "schema_valid": true, "schema_errors": [], "context_files": ["starlette/routing.py"], "context_truncated": false, "perf": {"ttft_seconds": 3.7963, "total_seconds": 8.4016, "gen_tps": 43.32, "gen_tokens": 199, "prompt_tokens": 7128, "peak_memory_gb": 5.028, "finish_reason": "stop"}, "grade": {"id": "TE-04", "category": "teaching", "difficulty": "medium", "structured_output": 2, "evidence_accuracy": 2, "evidence_file_recall": 1.0, "evidence_symbol_recall": 0.0, "fabricated_paths": [], "n_citations": 1, "completeness_proxy": 0, "concept_coverage": 0.2, "epistemic_alignment": 0, "epistemic_expected": "CONTRADICTED", "epistemic_got": "VERIFIED", "judge_ok": true, "judge_rationale": "Correctly refutes misconception, explains mechanism, and aligns with reference.", "correctness": 2, "completeness": 2, "architectural_reasoning": 2, "hallucination": 0, "teaching_quality": null, "composite": 0.8333, "composite_axes_used": ["correctness", "completeness", "architectural_reasoning", "hallucination", "evidence_accuracy", "structured_output"]}}, "qwen3-8b-4bit": {"answer_obj": {"answer": "The developer's explanation is incorrect. When mounting a sub-application at /v1, the routes inside that sub-application do not need to be declared with the /v1 prefix. Instead, the mount path is automatically prepended to the routes of the sub-application. For example, if you mount a sub-application at /v1 and define a route '/users' within that sub-application, it will be accessible at /v1/users.", "key_points": ["Mounting a sub-application at /v1 does not require routes to be prefixed with /v1.", "The mount path is automatically prepended to the sub-application's routes."], "evidence": [{"file": "starlette/routing.py", "symbol": "Mount.__init__", "why": "The Mount class constructs a path by stripping trailing slashes and uses it in the path_regex. The path is combined with the sub-application's routes, implying that the mount path is prepended automatically."}, {"file": "starlette/routing.py", "symbol": "Mount.matches", "why": "The matches method constructs the child_scope with the root_path and path_params, which suggests that the mount path is used to construct the full path for the sub-application's routes."}], "epistemic_status": "VERIFIED", "uncertainties": []}, "raw_text": "{\n  \"answer\": \"The developer's explanation is incorrect. When mounting a sub-application at /v1, the routes inside that sub-application do not need to be declared with the /v1 prefix. Instead, the mount path is automatically prepended to the routes of the sub-application. For example, if you mount a sub-application at /v1 and define a route '/users' within that sub-application, it will be accessible at /v1/users.\",\n  \"key_points\": [\n    \"Mounting a sub-application at /v1 does not require routes to be prefixed with /v1.\",\n    \"The mount path is automatically prepended to the sub-application's routes.\"\n  ],\n  \"evidence\": [\n    {\n      \"file\": \"starlette/routing.py\",\n      \"symbol\": \"Mount.__init__\",\n      \"why\": \"The Mount class constructs a path by stripping trailing slashes and uses it in the path_regex. The path is combined with the sub-application's routes, implying that the mount path is prepended automatically.\"\n    },\n    {\n      \"file\": \"starlette/routing.py\",\n      \"symbol\": \"Mount.matches\",\n      \"why\": \"The matches method constructs the child_scope with the root_path and path_params, which suggests that the mount path is used to construct the full path for the sub-application's routes.\"\n    }\n  ],\n  \"epistemic_status\": \"VERIFIED\",\n  \"uncertainties\": []\n}", "json_method": "clean", "schema_valid": true, "schema_errors": [], "context_files": ["starlette/routing.py"], "context_truncated": false, "perf": {"ttft_seconds": 8.7295, "total_seconds": 22.2323, "gen_tps": 22.32, "gen_tokens": 301, "prompt_tokens": 7134, "peak_memory_gb": 8.733, "finish_reason": "stop"}, "grade": {"id": "TE-04", "category": "teaching", "difficulty": "medium", "structured_output": 2, "evidence_accuracy": 2, "evidence_file_recall": 1.0, "evidence_symbol_recall": 0.5, "fabricated_paths": [], "n_citations": 2, "completeness_proxy": 0, "concept_coverage": 0.2, "epistemic_alignment": 0, "epistemic_expected": "CONTRADICTED", "epistemic_got": "VERIFIED", "judge_ok": true, "judge_rationale": "Correctly refutes misconception, explains mechanism, and provides evidence.", "correctness": 2, "completeness": 2, "architectural_reasoning": 2, "hallucination": 2, "teaching_quality": null, "composite": 1.0, "composite_axes_used": ["correctness", "completeness", "architectural_reasoning", "hallucination", "evidence_accuracy", "structured_output"]}}}}, {"id": "TR-01", "category": "transfer", "difficulty": "hard", "question": "Novel scenario: 'In production, one of my endpoints sees a request header that a middleware of mine is supposed to have deleted. Reason about where a header deletion can and cannot take effect in Starlette, and where I should look.'", "developer_explanation": null, "expected_answer": "Headers reach the endpoint via scope['headers'] (a list of (bytes, bytes) pairs). Request.headers is a lazily-built, immutable Headers view over scope['headers'], cached on first access. So: (1) A pure ASGI middleware that mutates scope['headers'] before calling the inner app WILL affect what the endpoint sees -- provided it runs before routing and before anything has cached request.headers. (2) A middleware that builds its own Request and calls request.headers.mutablecopy() or tries to modify request.headers directly does NOT change scope['headers'] -- Headers is immutable; only MutableHeaders on a fresh structure would, and that copy won't propagate. (3) A BaseHTTPMiddleware that edits the Request object it constructs is editing a different Request than the one the endpoint gets. (4) Ordering: if the deleting middleware is below (inside) another middleware that already read/cached headers, or if it runs after routing, it's too late. Where to look: is the middleware pure-ASGI or BaseHTTPMiddleware; does it mutate scope['headers'] or a Request; its position in build_middleware_stack; whether any earlier middleware caches request.headers.", "required_concepts": ["headers live in scope['headers'] as byte pairs", "Request.headers is an immutable, cached view", "only mutating scope['headers'] (pure ASGI, pre-routing) propagates", "BaseHTTPMiddleware edits a different Request object", "middleware ordering and caching timing matter"], "relevant_files": ["starlette/requests.py", "starlette/datastructures.py", "starlette/middleware/base.py", "starlette/applications.py"], "relevant_symbols": ["starlette/requests.py::HTTPConnection.headers", "starlette/datastructures.py::Headers", "starlette/datastructures.py::MutableHeaders"], "evidence": [{"file": "starlette/requests.py", "symbol": "starlette/requests.py::HTTPConnection.headers", "line_hint": null, "type": "SOURCE", "line": 133}, {"file": "starlette/datastructures.py", "symbol": "starlette/datastructures.py::Headers", "line_hint": null, "type": "SOURCE", "line": 500}], "common_misconceptions": ["You can del request.headers['x'] and the endpoint won't see it", "BaseHTTPMiddleware's request object is the same one the endpoint receives", "Header mutation works regardless of middleware order"], "answerable_from": "source_only", "expected_epistemic_status": "INFERRED", "grading_notes": "Transfer: reward a diagnosis path that distinguishes scope-level mutation from Request-object mutation and invokes ordering/caching. Must not assert a fabricated API (e.g. a nonexistent request.headers.delete()).", "points": 2, "answers": {"llama-3.2-3b-4bit": {"answer_obj": {"answer": "In Starlette, middleware can modify headers, but they cannot delete headers. If a middleware deletes a header, it will be restored by the next middleware in the stack, or by the application itself if no middleware is present. This is because middleware in Starlette is designed to be idempotent, meaning that applying the middleware multiple times has the same effect as applying it once. This is why you should look at the middleware stack and the application's configuration to determine where the header deletion took effect.", "key_points": ["Middleware in Starlette can modify headers, but not delete them.", "Header deletions are idempotent, meaning they will be restored by the next middleware or the application itself."], "evidence": [{"file": "starlette/middleware/base.py", "symbol": "Middleware(ServerErrorMiddleware, handler=error_handler, debug=debug)", "why": "This is where middleware is applied to every request. Middleware can modify headers, but not delete them."}], "epistemic_status": "VERIFIED", "uncertainties": ["The exact behavior of middleware in Starlette when it comes to header deletions is not explicitly documented."]}, "raw_text": "{\n  \"answer\": \"In Starlette, middleware can modify headers, but they cannot delete headers. If a middleware deletes a header, it will be restored by the next middleware in the const MODELS = DATA.models.map(m=>m.id);
const AXES = ["correctness","completeness","architectural_reasoning","hallucination","evidence_accuracy","structured_output","teaching_quality"];
const LS_KEY = "orion_task3_human_review_v1";
let human = {};
try{ human = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ human={}; }
const saveHuman = ()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(human)); }catch(e){} };

const el = (t,props={},...kids)=>{ const n=document.createElement(t); for(const[k,v]of Object.entries(props)){ if(k==="class")n.className=v; else if(k==="html")n.innerHTML=v; else if(k.startsWith("on"))n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);} for(const c of kids.flat()){ if(c==null)continue; n.append(c.nodeType?c:document.createTextNode(c)); } return n; };
const esc = s => (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const scoreClass = v => v==null?"":"s"+Math.max(0,Math.min(2,Math.round(v)));

// ---------- header / leaderboard
document.getElementById("hmeta").textContent =
  `${DATA.benchmark.repository} ${DATA.benchmark.version} @ ${(DATA.benchmark.commit_sha||"").slice(0,12)} · ${DATA.questions.length} questions · judge: ${DATA.judge||"none"}`;
const lead = document.getElementById("lead");
DATA.models.slice().sort((a,b)=>(b.summary.composite||0)-(a.summary.composite||0)).forEach(m=>{
  lead.append(el("div",{class:"m",html:
    `<b>${esc(m.id)}</b> · comp ${m.summary.composite ?? "—"} · halluc ${m.summary.hallucination ?? "—"} · schema ${m.summary.schema_valid_pct}% · ${m.summary.gen_tps ?? "—"} tok/s · ${m.summary.peak_memory_gb ?? "—"} GB`}));
});

// ---------- filters
const cats = [...new Set(DATA.questions.map(q=>q.category))];
const catState = new Set(cats);
const catBox = document.getElementById("catFilters");
cats.forEach(c=>{
  const cb = el("input",{type:"checkbox",checked:"checked",onchange:e=>{ e.target.checked?catState.add(c):catState.delete(c); render(); }});
  catBox.append(el("label",{},cb,c.replace(/_/g," ")));
});
const diffs=["easy","medium","hard"]; const diffState=new Set(diffs);
const diffBox=document.getElementById("diffFilters");
diffs.forEach(d=>{
  const cb=el("input",{type:"checkbox",checked:"checked",onchange:e=>{ e.target.checked?diffState.add(d):diffState.delete(d); render(); }});
  diffBox.append(el("label",{},cb,d));
});
["q","fDisagree","fHall","fSchema","fUnrev"].forEach(id=>document.getElementById(id).addEventListener("input",render));

function compositeOf(q,mid){ const g=q.answers[mid]?.grade||{}; return g.composite; }
function disagreement(q){
  const vs = MODELS.map(m=>compositeOf(q,m)).filter(v=>v!=null);
  return vs.length>1 ? Math.max(...vs)-Math.min(...vs) : 0;
}
function anyHall(q){ return MODELS.some(m=>{ const h=q.answers[m]?.grade?.hallucination; return h!=null && h<2; }); }
function anySchemaBad(q){ return MODELS.some(m=>q.answers[m]?.schema_valid===false); }
function reviewedAll(q){ return MODELS.every(m=>human[q.id]?.[m]?.done); }

let selected = null;
function passes(q){
  if(!catState.has(q.category)) return false;
  if(!diffState.has(q.difficulty)) return false;
  const term = document.getElementById("q").value.trim().toLowerCase();
  if(term){
    const hay = (q.id+" "+q.question+" "+(q.required_concepts||[]).join(" ")+" "+q.category).toLowerCase();
    if(!hay.includes(term)) return false;
  }
  if(document.getElementById("fDisagree").checked && disagreement(q) < 0.25) return false;
  if(document.getElementById("fHall").checked && !anyHall(q)) return false;
  if(document.getElementById("fSchema").checked && !anySchemaBad(q)) return false;
  if(document.getElementById("fUnrev").checked && reviewedAll(q)) return false;
  return true;
}

function render(){
  const list = document.getElementById("qlist");
  list.innerHTML="";
  const shown = DATA.questions.filter(passes);
  shown.forEach(q=>{
    const pips = el("div",{class:"scorepips"});
    MODELS.forEach(m=>{
      const c = compositeOf(q,m);
      pips.append(el("span",{class:"pip",html:`${esc(m.split("-")[0])} <b>${c==null?"—":c.toFixed(2)}</b>`}));
    });
    const d = disagreement(q);
    const item = el("div",{class:"qitem"+(selected===q.id?" sel":""),onclick:()=>{selected=q.id;render();showDetail(q);}},
      el("div",{class:"top"},
        el("span",{class:"qid"},q.id),
        el("span",{class:"chip diff-"+q.difficulty},q.difficulty),
        el("span",{class:"chip"},q.category.replace(/_/g," ")),
        d>=0.25?el("span",{class:"chip",html:`Δ <span class="delta big">${d.toFixed(2)}</span>`}):null,
        anyHall(q)?el("span",{class:"chip",html:"⚠ halluc"}):null,
        reviewedAll(q)?el("span",{class:"chip",html:"✓ mine"}):null,
      ),
      el("div",{class:"qtext"},q.question),
      pips
    );
    list.append(item);
  });
  if(!list.children.length) list.append(el("div",{class:"qitem"},"no questions match filters"));
}

function humanBlock(q,mid){
  human[q.id] = human[q.id]||{}; human[q.id][mid] = human[q.id][mid]||{scores:{},note:""};
  const rec = human[q.id][mid];
  const wrap = el("div",{class:"human"});
  wrap.append(el("div",{class:"k",html:"<b>My review</b>"}));
  AXES.forEach(ax=>{
    const row = el("div",{class:"axis"}, el("span",{},ax));
    [0,1,2].forEach(v=>{
      const b = el("button",{class:(rec.scores[ax]===v?"on":""),onclick:()=>{
        rec.scores[ax]=(rec.scores[ax]===v?undefined:v); rec.done=Object.keys(rec.scores).some(k=>rec.scores[k]!=null);
        saveHuman(); showDetail(q); render();
      }}, String(v));
      row.append(b);
    });
    wrap.append(row);
  });
  const ta = el("textarea",{placeholder:"notes / where the auto-grade is wrong…",oninput:e=>{rec.note=e.target.value;rec.done=true;saveHuman();}});
  ta.value = rec.note||"";
  wrap.append(ta);
  return wrap;
}

function showDetail(q){
  const d = document.getElementById("detail");
  d.innerHTML="";
  d.append(el("h2",{},q.id+" — "+q.category.replace(/_/g," ")));
  d.append(el("div",{class:"qmeta"},`difficulty ${q.difficulty} · points ${q.points} · answerable_from ${q.answerable_from} · expected epistemic_status ${q.expected_epistemic_status||"—"}`));

  const qc = el("div",{class:"card"});
  qc.append(el("h3",{},"Question"));
  qc.append(el("div",{},q.question));
  if(q.developer_explanation){
    qc.append(el("div",{class:"kv"}, el("div",{class:"k"},"developer explanation under test"), el("div",{},q.developer_explanation)));
  }
  d.append(qc);

  const gt = el("div",{class:"card"});
  gt.append(el("h3",{},"Ground truth"));
  gt.append(el("div",{class:"kv"}, el("div",{class:"k"},"expected answer"), el("div",{},q.expected_answer)));
  gt.append(el("div",{class:"kv"}, el("div",{class:"k"},"required concepts"),
    el("div",{class:"tags"}, (q.required_concepts||[]).map(c=>el("span",{class:"tag"},c)))));
  if((q.common_misconceptions||[]).length)
    gt.append(el("div",{class:"kv"}, el("div",{class:"k"},"common misconceptions (penalise if asserted)"),
      el("div",{class:"tags"}, q.common_misconceptions.map(c=>el("span",{class:"tag bad"},c)))));
  gt.append(el("div",{class:"kv"}, el("div",{class:"k"},"evidence anchors"),
    el("div",{class:"tags"}, (q.evidence||[]).map(e=>el("span",{class:"tag"}, (e.file||"")+(e.symbol?" :: "+e.symbol.split("::").pop():"")+(e.line?" :"+e.line:""))))));
  gt.append(el("details",{}, el("summary",{},"grading notes"), el("div",{class:"rationale"},q.grading_notes||"")));
  d.append(gt);

  const cols = el("div",{class:"cols"});
  cols.style.gridTemplateColumns = MODELS.length>1 ? "repeat("+MODELS.length+",1fr)" : "1fr";
  MODELS.forEach(mid=>{
    const a = q.answers[mid]||{}; const g = a.grade||{}; const o = a.answer_obj;
    const mc = el("div",{class:"modelcard"});
    mc.append(el("div",{class:"name"},mid));
    const gr = el("div",{class:"grades"});
    gr.append(el("span",{class:"g",html:`composite <b>${g.composite==null?"—":g.composite.toFixed(3)}</b>`}));
    AXES.forEach(ax=>{ if(g[ax]!=null) gr.append(el("span",{class:"g "+scoreClass(g[ax])},`${ax.split("_")[0]} ${g[ax]}`)); });
    if(g.epistemic_got!=null) gr.append(el("span",{class:"g"+(g.epistemic_got===g.epistemic_expected?" s2":" s0")},`epis ${g.epistemic_got}→${g.epistemic_expected}`));
    if(g.concept_coverage!=null) gr.append(el("span",{class:"g"},`concepts ${(g.concept_coverage*100|0)}%`));
    if(a.schema_valid===false) gr.append(el("span",{class:"g s0"},`schema BAD (${a.json_method})`));
    if(a.context_truncated) gr.append(el("span",{class:"g s1"},"ctx truncated"));
    mc.append(gr);
    if(g.judge_rationale) mc.append(el("div",{class:"rationale"},"judge: "+g.judge_rationale));
    if(g.fabricated_paths && g.fabricated_paths.length) mc.append(el("div",{class:"rationale",html:`<mark>fabricated paths:</mark> ${esc(g.fabricated_paths.join(", "))}`}));

    if(o){
      mc.append(el("div",{class:"ans"}, o.answer||"(no answer field)"));
      if((o.key_points||[]).length) mc.append(el("div",{class:"kv"}, el("div",{class:"k"},"key points"),
        el("ul",{}, o.key_points.map(k=>el("li",{},k)))));
      if((o.evidence||[]).length) mc.append(el("div",{class:"kv"}, el("div",{class:"k"},"cited evidence"),
        el("div",{class:"tags"}, o.evidence.map(e=>el("span",{class:"tag"}, (e.file||"?")+(e.symbol?" :: "+e.symbol:"") )))));
      if((o.uncertainties||[]).length) mc.append(el("div",{class:"kv"}, el("div",{class:"k"},"uncertainties"),
        el("div",{class:"tags"}, o.uncertainties.map(u=>el("span",{class:"tag"},u)))));
      mc.append(el("div",{class:"perf"},`epistemic_status: ${o.epistemic_status||"—"}`));
    } else {
      mc.append(el("div",{class:"ans"},"(no parseable JSON object)"));
    }
    mc.append(el("details",{}, el("summary",{},"raw completion"), el("pre",{}, a.raw_text||"")));
    mc.append(el("details",{}, el("summary",{},`context files (${(a.context_files||[]).length})`),
      el("pre",{}, (a.context_files||[]).join("\n"))));
    const p = a.perf||{};
    mc.append(el("div",{class:"perf"},
      `ttft ${p.ttft_seconds ?? "—"}s · ${p.gen_tps ?? "—"} tok/s · gen ${p.gen_tokens ?? "—"} tok · prompt ${p.prompt_tokens ?? "—"} tok · peak ${p.peak_memory_gb ?? "—"} GB · ${p.finish_reason ?? ""}`));
    mc.append(humanBlock(q,mid));
    cols.append(mc);
  });
  d.append(cols);
  d.scrollTop = 0;
}

document.getElementById("btnExport").onclick = ()=>{
  const rows=[];
  for(const [qid,perModel] of Object.entries(human)){
    for(const [mid,rec] of Object.entries(perModel)){
      if(!rec.done) continue;
      rows.push({question_id:qid, model:mid, human_scores:rec.scores, note:rec.note||""});
    }
  }
  const blob = new Blob([JSON.stringify({exported:new Date().toISOString(),
    benchmark:DATA.benchmark, judge:DATA.judge, reviews:rows}, null, 2)], {type:"application/json"});
  const u = URL.createObjectURL(blob);
  const a = el("a",{href:u,download:"orion_task3_human_review.json"}); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(u);
};
document.getElementById("btnClear").onclick = ()=>{ if(confirm("Clear all your human review notes?")){ human={}; saveHuman(); render(); if(selected) showDetail(DATA.questions.find(q=>q.id===selected)); } };

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(e.key!=="j"&&e.key!=="k") return;
  const shown = DATA.questions.filter(passes);
  let i = shown.findIndex(q=>q.id===selected);
  i = e.key==="j" ? Math.min(shown.length-1,i+1) : Math.max(0,i-1);
  if(shown[i]){ selected=shown[i].id; render(); showDetail(shown[i]); document.querySelector(".qitem.sel")?.scrollIntoView({block:"nearest"}); }
});

render();
if(DATA.questions.length){ selected=DATA.questions[0].id; render(); showDetail(DATA.questions[0]); }
</script>
